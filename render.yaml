services:
  # Backend Express API
  - type: web
    name: fitness-garage-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true

  # Frontend Next.js Website
  - type: web
    name: fitness-garage-web
    runtime: node
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: fitness-garage-api
          property: host
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
